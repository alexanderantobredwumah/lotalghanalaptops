<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Specification — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
        <a href="/index.html#contact" class="nav-link">Contact</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="auth-user-slot"></div>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px; position: relative;">
          Cart <span class="cart-count-badge tabular" style="display: none; background: var(--color-gold); color: #000; font-size: 0.65rem; border-radius: 50%; width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: 6px; font-weight: 700;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding: 40px 0;">
    <div class="container" id="productContainer">
      <!-- Loaded by JS -->
      <div style="text-align: center; padding: 60px 0; color: var(--color-steel);">
        Loading laptop specs...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--color-steel);">
      <p>© 2026 LOTAL GHANA LTD · 14-DAY WARRANTY ON EVERY UNIT</p>
      <p><a href="/track.html" style="color: var(--color-blue-light);">TRACK AN ORDER</a></p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get("slug") || "macbook-pro-14-m1-pro";
      const product = await Store.getProductBySlug(slug);
      const container = document.getElementById("productContainer");

      if (!product) {
        container.innerHTML = `
          <div class="plate-flat" style="padding: 60px 20px; text-align: center;">
            <p style="font-size: 1.4rem; color: white;">This laptop is no longer on the bench.</p>
            <p style="font-size: 0.9rem; color: var(--color-steel); margin-top: 8px;">It may have been sold out.</p>
            <a href="/shop.html" class="btn btn-primary" style="margin-top: 24px;">Browse Available Stock →</a>
          </div>
        `;
        return;
      }

      document.title = `${product.brand} ${product.name} — LOTAL GHANA`;

      container.innerHTML = `
        <div style="margin-bottom: 24px;">
          <a href="/shop.html" class="micro" style="color: var(--color-steel);">← Back to Inventory</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px;">
          <div>
            <div class="plate" style="overflow: hidden; padding: 20px;">
              <img src="${product.image}" alt="${product.name}" style="width: 100%; height: auto; max-height: 420px; object-fit: cover; border-radius: 4px;">
            </div>

            <!-- Full Spec Details -->
            <div class="plate-flat" style="padding: 24px; margin-top: 24px;">
              <p class="micro micro-gold">32-Point Diagnostic Specification</p>
              <table style="width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 0.9rem;">
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Processor</td><td class="tabular" style="padding: 10px 0; text-align: right; color: white;">${product.processor}</td></tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Memory (RAM)</td><td class="tabular" style="padding: 10px 0; text-align: right; color: white;">${product.ram}</td></tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Storage (SSD)</td><td class="tabular" style="padding: 10px 0; text-align: right; color: white;">${product.storage}</td></tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Display</td><td class="tabular" style="padding: 10px 0; text-align: right; color: white;">${product.screen}</td></tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Graphics</td><td class="tabular" style="padding: 10px 0; text-align: right; color: white;">${product.graphics || 'Integrated'}</td></tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Battery Health</td><td class="tabular" style="padding: 10px 0; text-align: right; color: var(--color-blue-light); font-weight: 600;">${product.batteryHealth || product.battery_health}% (Tested)</td></tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Operating System</td><td class="tabular" style="padding: 10px 0; text-align: right; color: white;">${product.os}</td></tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);"><td class="micro" style="padding: 10px 0;">Ports</td><td class="tabular" style="padding: 10px 0; text-align: right; color: var(--color-fog);">${product.ports}</td></tr>
                <tr><td class="micro" style="padding: 10px 0;">Warranty</td><td class="tabular" style="padding: 10px 0; text-align: right; color: var(--color-gold); font-weight: 600;">14 Days (Parts & Labour)</td></tr>
              </table>
            </div>
          </div>

          <div>
            <span class="micro micro-gold">${product.brand} / ${product.name}</span>
            <h1 class="display" style="font-size: 2.4rem; color: white; margin-top: 8px;">${product.name}</h1>
            <p style="font-size: 0.95rem; color: var(--color-steel); margin-top: 6px;">${product.tagline}</p>

            <div style="margin-top: 24px; display: flex; align-items: baseline; gap: 16px;">
              <span class="tabular" style="font-size: 2.2rem; color: var(--color-gold); font-weight: 700;">${formatGHS(product.price)}</span>
              ${product.oldPrice || product.old_price ? `<span class="tabular" style="text-decoration: line-through; color: var(--color-steel); font-size: 1.1rem;">${formatGHS(product.oldPrice || product.old_price)}</span>` : ""}
            </div>

            <!-- 14-Day Warranty & Condition Banner -->
            <div class="plate-flat" style="padding: 18px; margin-top: 24px; border-left: 3px solid var(--color-gold);">
              <p class="micro micro-gold">14-Day Warranty Guarantee</p>
              <p style="font-size: 0.88rem; color: var(--color-fog); margin-top: 6px; line-height: 1.5;">
                ${product.gradeNote || product.grade_note || `Grade ${product.grade} unit. Inspected, cleaned and re-certified on our bench in Osu.`}
              </p>
              <p class="micro" style="margin-top: 8px; color: var(--color-steel);">Every order includes printed 14-day warranty certificate & charger.</p>
            </div>

            <!-- Add to Cart & Buy -->
            <div style="margin-top: 28px; display: flex; gap: 12px; align-items: center;">
              <input type="number" id="qtyInput" value="1" min="1" max="${product.stock}" class="field" style="width: 80px; text-align: center;">
              <button type="button" id="addToCartBtn" class="btn btn-primary" style="flex: 1;">Add to Cart →</button>
            </div>

            <div style="margin-top: 28px; font-size: 0.85rem; color: var(--color-steel); line-height: 1.7;">
              <p>✓ 14-day warranty on all hardware parts & labour</p>
              <p>✓ 7-day no-questions return window</p>
              <p>✓ Paystack secure gateway (MTN MoMo, Telecel Cash, Cards)</p>
              <p>✓ Pay on delivery inside Accra & Tema</p>
              <p>✓ Unique tracking code issued for every order</p>
            </div>
          </div>
        </div>
      `;

      document.getElementById("addToCartBtn").addEventListener("click", () => {
        const qty = parseInt(document.getElementById("qtyInput").value, 10) || 1;
        Cart.add(product, qty);
        window.location.href = "/cart.html";
      });
    });
  </script>
</body>
</html>
