<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
        <a href="/index.html#contact" class="nav-link">Contact</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="auth-user-slot"></div>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px; position: relative;">
          Cart <span class="cart-count-badge tabular" style="display: none; background: var(--color-gold); color: #000; font-size: 0.65rem; border-radius: 50%; width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: 6px; font-weight: 700;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding: 50px 0;">
    <div class="container" style="max-width: 900px;" id="orderView">
      <!-- Loaded by JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--color-steel);">
      <p>© 2026 LOTAL GHANA LTD · 14-DAY WARRANTY ON EVERY UNIT</p>
      <p><a href="/track.html" style="color: var(--color-blue-light);">TRACK AN ORDER</a></p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      const container = document.getElementById("orderView");

      if (!code) {
        window.location.href = "/track.html";
        return;
      }

      const order = await Store.getOrderByCode(code);
      if (!order) {
        container.innerHTML = `
          <div class="plate-flat" style="padding: 50px 20px; text-align: center;">
            <p style="font-size: 1.3rem; color: white;">Order not found.</p>
            <a href="/track.html" class="btn btn-primary" style="margin-top: 16px;">Track Another Code</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <p class="micro micro-gold">Order Confirmed / Thank You</p>
        <h1 class="display" style="font-size: 2.6rem; color: white; margin-top: 8px;">Your Order is Booked</h1>
        <p style="margin-top: 10px; font-size: 1rem; color: var(--color-fog); opacity: 0.85;">
          Thank you for choosing LOTAL GHANA. Your unique tracking code is printed below — save it to track your laptop anytime.
        </p>

        <!-- Tracking Code Card -->
        <div class="plate" style="padding: 32px; margin-top: 30px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
              <span class="micro micro-gold">YOUR UNIQUE TRACKING CODE</span>
              <p class="tabular" style="font-size: clamp(2rem, 5vw, 3.2rem); color: white; font-weight: 700; margin-top: 6px; letter-spacing: 0.05em;">
                ${order.code}
              </p>
              <p class="micro" style="margin-top: 8px; color: var(--color-steel);">
                Destination: ${order.city} · Status: <span style="color: var(--color-gold);">${(order.status || 'placed').toUpperCase()}</span> · Payment: ${order.payment_method || order.paymentMethod}
              </p>
            </div>
            <div>
              <a href="/track.html?code=${encodeURIComponent(order.code)}" class="btn btn-primary">Track Live →</a>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 30px;">
          <div class="plate-flat" style="padding: 24px;">
            <p class="micro micro-gold">14-Day Warranty Guarantee</p>
            <p style="font-size: 0.9rem; color: var(--color-steel); margin-top: 8px; line-height: 1.6;">
              Parts and labour covered for 14 full days from delivery. If any defect appears, we repair, replace or refund. 7-day return policy included.
            </p>
          </div>
          <div class="plate-flat" style="padding: 24px;">
            <p class="micro micro-gold">Delivery Address</p>
            <p style="font-size: 0.9rem; color: var(--color-fog); margin-top: 8px; line-height: 1.5;">
              <strong>${order.full_name || order.fullName}</strong><br>
              ${order.address}<br>
              ${order.city}, Ghana<br>
              ${order.phone}
            </p>
          </div>
        </div>

        <div class="plate-flat" style="padding: 24px; margin-top: 24px;">
          <p class="micro micro-gold">Order Items</p>
          <table style="width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 0.9rem;">
            ${(order.items || []).map(item => `
              <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);">
                <td style="padding: 10px 0; color: white;">${item.brand || ''} ${item.name || item.title} (×${item.qty})</td>
                <td class="tabular" style="padding: 10px 0; text-align: right; color: var(--color-gold);">${formatGHS((item.price || item.unit_price) * item.qty)}</td>
              </tr>
            `).join("")}
            <tr>
              <td class="micro" style="padding: 14px 0 0 0;">Total Paid (Including Delivery)</td>
              <td class="tabular" style="padding: 14px 0 0 0; text-align: right; color: var(--color-gold); font-size: 1.3rem; font-weight: 700;">
                ${formatGHS(order.total)}
              </td>
            </tr>
          </table>
        </div>
      `;
    });
  </script>
</body>
</html>
