<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
        <a href="/index.html#contact" class="nav-link">Contact</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="auth-user-slot"></div>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px; position: relative; border-color: var(--color-blue);">
          Cart <span class="cart-count-badge tabular" style="display: none; background: var(--color-gold); color: #000; font-size: 0.65rem; border-radius: 50%; width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: 6px; font-weight: 700;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding: 40px 0;">
    <div class="container">
      <p class="micro micro-gold">Cart / Review Your Units</p>
      <h1 class="display" style="font-size: 2.5rem; color: white; margin-top: 8px;">Shopping Cart</h1>

      <div id="cartContent" style="margin-top: 30px;">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--color-steel);">
      <p>© 2026 LOTAL GHANA LTD · 14-DAY WARRANTY ON EVERY UNIT</p>
      <p><a href="/track.html" style="color: var(--color-blue-light);">TRACK AN ORDER</a></p>
    </div>
  </footer>

  <script>
    function renderCart() {
      const items = Cart.get();
      const content = document.getElementById("cartContent");
      if (items.length === 0) {
        content.innerHTML = `
          <div class="plate-flat" style="padding: 60px 20px; text-align: center;">
            <p style="font-size: 1.3rem; color: white;">Your shopping cart is currently empty.</p>
            <p style="font-size: 0.9rem; color: var(--color-steel); margin-top: 8px;">Explore our tested inventory of graded used laptops.</p>
            <a href="/shop.html" class="btn btn-primary" style="margin-top: 24px;">Browse Available Laptops →</a>
          </div>
        `;
        return;
      }

      const subtotal = Cart.subtotal();

      content.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px;">
          <div>
            <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px;">
              <span class="micro">${items.length} Unit(s) in Cart</span>
              <button onclick="Cart.clear(); renderCart();" style="background: none; border: none; cursor: pointer; color: var(--color-steel); font-size: 0.8rem;">Clear All</button>
            </div>
            ${items.map(item => `
              <div style="display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.06); align-items: center;">
                <img src="${item.image}" alt="" style="width: 80px; height: 60px; object-fit: cover; border-radius: 4px;">
                <div style="flex: 1;">
                  <h4 style="color: white; font-size: 1rem;">${item.brand} ${item.name}</h4>
                  <p class="tabular" style="color: var(--color-gold); font-size: 0.9rem; margin-top: 4px;">${formatGHS(item.price)} × ${item.qty}</p>
                </div>
                <button onclick="Cart.setQty('${item.id}', 0); renderCart();" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.7rem; color: #ff6b6b;">Remove</button>
              </div>
            `).join("")}
          </div>

          <div>
            <div class="plate" style="padding: 24px;">
              <p class="micro micro-gold">Order Summary</p>
              <div style="display: flex; justify-content: space-between; margin-top: 16px; font-size: 0.95rem;">
                <span style="color: var(--color-steel);">Subtotal</span>
                <span class="tabular" style="color: white; font-weight: 600;">${formatGHS(subtotal)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 0.95rem;">
                <span style="color: var(--color-steel);">14-Day Warranty</span>
                <span style="color: var(--color-gold);">Covered</span>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 0.95rem;">
                <span style="color: var(--color-steel);">Delivery</span>
                <span style="color: var(--color-fog);">Calculated at checkout</span>
              </div>
              <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: baseline;">
                <span class="micro" style="color: white;">Estimated Total</span>
                <span class="tabular" style="font-size: 1.5rem; color: var(--color-gold); font-weight: 700;">${formatGHS(subtotal)}</span>
              </div>
              <a href="/checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Proceed to Checkout →</a>
              <p class="micro" style="margin-top: 16px; text-align: center; color: var(--color-steel);">Paystack MoMo & Cards / Pay on Delivery</p>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", renderCart);
  </script>
</body>
</html>
