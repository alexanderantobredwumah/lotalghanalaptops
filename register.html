<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body style="background: radial-gradient(circle at 50% 30%, rgba(27,107,255,0.12), var(--color-void) 70%);">

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
      </nav>

      <div>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px;">Cart</a>
      </div>
    </div>
  </header>

  <main style="display: flex; align-items: center; justify-content: center; padding: 60px 20px;">
    <div class="glass" style="max-width: 480px; width: 100%; padding: 36px; border-radius: 8px;">
      <p class="micro micro-gold">Account / Registration</p>
      <h1 class="display" style="font-size: 2rem; color: white; margin-top: 8px;">Create Buyer Account</h1>
      <p style="font-size: 0.88rem; color: var(--color-steel); margin-top: 6px;">
        Account creation is required before purchasing to bind your <strong>14-day warranty</strong> and receive unique tracking codes.
      </p>

      <div id="errorBox" style="display: none; background: rgba(255,80,80,0.15); color: #ff9999; padding: 12px; border-radius: 4px; margin-top: 16px; font-size: 0.88rem;"></div>

      <form id="registerForm" style="margin-top: 24px;">
        <div>
          <label class="micro">Full Name</label>
          <input type="text" id="regName" required class="field" style="margin-top: 6px;" placeholder="Ama Serwaa Mensah">
        </div>
        <div style="margin-top: 16px;">
          <label class="micro">Email Address</label>
          <input type="email" id="regEmail" required class="field" style="margin-top: 6px;" placeholder="you@example.com">
        </div>
        <div style="margin-top: 16px;">
          <label class="micro">Phone (MoMo Number)</label>
          <input type="text" id="regPhone" required class="field" style="margin-top: 6px;" placeholder="+233 55 190 4477">
        </div>
        <div style="margin-top: 16px;">
          <label class="micro">City / Region</label>
          <select id="regCity" class="field" style="margin-top: 6px;">
            <option value="Accra">Accra</option>
            <option value="Tema">Tema</option>
            <option value="Kumasi">Kumasi</option>
            <option value="Takoradi">Takoradi</option>
            <option value="Cape Coast">Cape Coast</option>
            <option value="Tamale">Tamale</option>
          </select>
        </div>
        <div style="margin-top: 16px;">
          <label class="micro">Password (8+ Characters)</label>
          <input type="password" id="regPass" minlength="8" required class="field" style="margin-top: 6px;" placeholder="••••••••">
        </div>
        <div style="margin-top: 16px; display: flex; gap: 8px; align-items: flex-start;">
          <input type="checkbox" required checked id="terms" style="margin-top: 4px;">
          <label for="terms" style="font-size: 0.82rem; color: var(--color-steel); line-height: 1.4;">
            I agree to the LOTAL GHANA terms of sale and understand every laptop includes a 14-day warranty and 7-day return policy.
          </label>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Register Account →</button>
      </form>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); text-align: center; font-size: 0.88rem; color: var(--color-steel);">
        Already have an account? <a href="/login.html" style="color: var(--color-blue-light); text-decoration: underline;">Sign In</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type='submit']");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Registering in Supabase...";
      }

      const fullName = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const phone = document.getElementById("regPhone").value.trim();
      const city = document.getElementById("regCity").value;
      const password = document.getElementById("regPass").value;
      const errBox = document.getElementById("errorBox");
      errBox.style.display = "none";

      const res = await Store.registerCustomer({ fullName, email, phone, city, password });
      if (!res.ok) {
        errBox.textContent = res.error || "Registration failed.";
        errBox.style.display = "block";
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Register Account →";
        }
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      window.location.href = urlParams.get("next") || "account.html";
    });
  </script>
</body>
</html>
