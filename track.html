<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link" style="color: white;">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
        <a href="/index.html#contact" class="nav-link">Contact</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="auth-user-slot"></div>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px; position: relative;">
          Cart <span class="cart-count-badge tabular" style="display: none; background: var(--color-gold); color: #000; font-size: 0.65rem; border-radius: 50%; width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: 6px; font-weight: 700;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding: 50px 0;">
    <div class="container" style="max-width: 960px;">
      <p class="micro micro-gold">Order Tracking / Live Milestone Rail</p>
      <h1 class="display" style="font-size: 2.8rem; color: white; margin-top: 8px;">Track Your Delivery</h1>
      <p style="margin-top: 8px; font-size: 0.95rem; color: var(--color-steel);">
        Enter the unique 11-character code from your receipt (e.g. LT-XXXX-XXXX-X). No account required.
      </p>

      <!-- Search Input -->
      <form id="trackForm" class="glass" style="padding: 24px; border-radius: 8px; margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap;">
        <input type="text" id="trackInput" placeholder="LT-4KZP-92QF-7M" class="field tabular" style="flex: 1; min-width: 240px; font-size: 1.15rem; letter-spacing: 0.08em; text-transform: uppercase;" required>
        <button type="submit" class="btn btn-primary">Track Order →</button>
      </form>

      <div id="trackResult" style="margin-top: 30px;">
        <!-- Loaded by JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--color-steel);">
      <p>© 2026 LOTAL GHANA LTD · 14-DAY WARRANTY ON EVERY UNIT</p>
      <p><a href="/track.html" style="color: var(--color-blue-light);">TRACK AN ORDER</a></p>
    </div>
  </footer>

  <script>
    const STATUSES = ['placed', 'paid', 'packing', 'dispatched', 'out_for_delivery', 'delivered'];
    const STATUS_LABELS = {
      placed: 'Order Placed',
      paid: 'Payment Confirmed',
      packing: 'Diagnostic & Packing',
      dispatched: 'Dispatched from Osu',
      out_for_delivery: 'Out for Delivery',
      delivered: 'Delivered (14-Day Warranty Active)'
    };

    async function performTracking(code) {
      const cleanCode = (code || '').trim().toUpperCase();
      const resultDiv = document.getElementById("trackResult");
      if (!cleanCode) return;

      if (!isValidTrackingCode(cleanCode)) {
        resultDiv.innerHTML = `
          <div style="background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); color: #ff9999; padding: 14px; border-radius: 4px;">
            Invalid tracking code format. LOTAL tracking codes always look like LT-XXXX-XXXX-X. Please check your receipt.
          </div>
        `;
        return;
      }

      resultDiv.innerHTML = `<div style="text-align: center; padding: 30px; color: var(--color-steel);">Looking up tracking code...</div>`;
      const order = await Store.getOrderByCode(cleanCode);

      if (!order) {
        resultDiv.innerHTML = `
          <div style="background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); color: #ff9999; padding: 14px; border-radius: 4px;">
            No order found matching tracking code <strong>${cleanCode}</strong>.
          </div>
        `;
        return;
      }

      const currentStatus = order.status || 'placed';
      let currentIdx = STATUSES.indexOf(currentStatus);
      if (currentIdx === -1) currentIdx = 0;

      resultDiv.innerHTML = `
        <div class="plate" style="padding: 32px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
            <div>
              <span class="micro micro-gold">TRACKING CODE</span>
              <p class="tabular" style="font-size: 2.2rem; color: white; font-weight: 700; margin-top: 4px;">
                ${order.code}
              </p>
              <p class="micro" style="margin-top: 6px; color: var(--color-steel);">
                Destination: ${order.city} · Placed: ${new Date(order.created_at).toLocaleDateString()}
              </p>
            </div>
            <div style="text-align: right;">
              <span class="micro">CURRENT MILESTONE</span>
              <p class="display" style="font-size: 1.4rem; color: var(--color-blue-light); margin-top: 4px;">
                ${STATUS_LABELS[currentStatus] || currentStatus.toUpperCase()}
              </p>
            </div>
          </div>

          <!-- Progress Rail -->
          <div style="margin-top: 36px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px;">
            <div class="rail-track">
              ${STATUSES.map((st, idx) => {
                const isDone = idx <= currentIdx;
                return `
                  <div class="rail-step ${isDone ? 'active' : ''}">
                    <span class="micro" style="color: ${isDone ? 'var(--color-blue-light)' : 'var(--color-steel)'}; font-size: 0.58rem;">
                      0${idx + 1} ${isDone ? '✓' : ''}
                    </span>
                    <p style="font-size: 0.82rem; color: ${isDone ? 'white' : 'var(--color-steel)'}; margin-top: 4px; font-weight: 500;">
                      ${STATUS_LABELS[st]}
                    </p>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 24px;">
          <div class="plate-flat" style="padding: 24px;">
            <p class="micro micro-gold">Order Units (${(order.items || []).length})</p>
            <ul style="list-style: none; margin-top: 14px;">
              ${(order.items || []).map(item => `
                <li style="display: flex; justify-content: space-between; font-size: 0.9rem; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
                  <span style="color: white;">${item.brand || ''} ${item.name || item.title} (×${item.qty})</span>
                  <span class="tabular" style="color: var(--color-gold);">${formatGHS((item.price || item.unit_price) * item.qty)}</span>
                </li>
              `).join("")}
            </ul>
            <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between;">
              <span class="micro">Total</span>
              <span class="tabular" style="color: var(--color-gold); font-size: 1.2rem; font-weight: 700;">${formatGHS(order.total)}</span>
            </div>
            <p class="micro" style="margin-top: 14px; color: var(--color-steel);">14-day warranty active.</p>
          </div>

          <div class="plate-flat" style="padding: 24px;">
            <p class="micro micro-gold">Event Log</p>
            <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 14px;">
              ${((order.events && order.events.length) ? [...order.events].reverse() : [{ title: 'Order Placed', note: 'Order registered on tracking rail.', created_at: order.created_at }]).map(ev => `
                <div style="border-left: 2px solid var(--color-blue); padding-left: 12px;">
                  <strong style="color: white; font-size: 0.9rem;">${ev.title}</strong>
                  ${ev.note ? `<p style="font-size: 0.82rem; color: var(--color-steel); margin-top: 2px;">${ev.note}</p>` : ''}
                  <span class="micro" style="color: var(--color-steel); font-size: 0.58rem;">${new Date(ev.created_at).toLocaleString()}</span>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    document.getElementById("trackForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("trackInput").value;
      performTracking(code);
      window.history.replaceState(null, "", `/track.html?code=${encodeURIComponent(code.trim().toUpperCase())}`);
    });

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      if (code) {
        document.getElementById("trackInput").value = code;
        performTracking(code);
      }
    });
  </script>
</body>
</html>
