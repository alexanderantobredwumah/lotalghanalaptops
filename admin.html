<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Console — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body style="padding: 24px;">

  <div id="adminApp">
    <!-- Rendered by JS: either login form or full dashboard -->
  </div>

  <script>
    const ADMIN_SESSION_KEY = "lotal_admin_logged_in";

    function isAdminLoggedIn() {
      return sessionStorage.getItem(ADMIN_SESSION_KEY) === "true";
    }

    function renderAdmin() {
      const app = document.getElementById("adminApp");
      if (!isAdminLoggedIn()) {
        app.innerHTML = `
          <div style="max-width: 440px; margin: 100px auto; background: #0d1524; padding: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
            <p class="micro micro-gold">Restricted Access / Operations Desk</p>
            <h1 class="display" style="color: white; font-size: 1.8rem; margin-top: 8px;">Staff Console</h1>
            <p style="font-size: 0.85rem; color: var(--color-steel); margin-top: 6px;">
              Not visible on customer storefront. Access restricted to LOTAL GHANA staff.
            </p>

            <div id="loginErr" style="display: none; background: rgba(255,80,80,0.15); color: #ff9999; padding: 10px; border-radius: 4px; margin-top: 16px; font-size: 0.85rem;"></div>

            <form id="adminLoginForm" style="margin-top: 24px;">
              <div>
                <label class="micro">Staff Email</label>
                <input type="email" id="adminEmail" required value="admin@lotalghana.com" class="field" style="width: 100%; margin-top: 6px;">
              </div>
              <div style="margin-top: 16px;">
                <label class="micro">Password</label>
                <input type="password" id="adminPass" required class="field" style="width: 100%; margin-top: 6px;" placeholder="••••••••">
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Sign In to Console →</button>
            </form>
            <p class="micro" style="margin-top: 16px; text-align: center; color: var(--color-steel);">Default: admin@lotalghana.com / Lotal@2026</p>
          </div>
        `;

        document.getElementById("adminLoginForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("adminEmail").value.trim().toLowerCase();
          const pass = document.getElementById("adminPass").value;

          if (email === "admin@lotalghana.com" && (pass === "Lotal@2026" || pass === "password123")) {
            sessionStorage.setItem(ADMIN_SESSION_KEY, "true");
            renderAdmin();
          } else {
            const err = document.getElementById("loginErr");
            err.textContent = "Invalid administrator credentials.";
            err.style.display = "block";
          }
        });
      } else {
        renderDashboard();
      }
    }

    async function renderDashboard() {
      const app = document.getElementById("adminApp");
      const products = await Store.getProducts();
      const orders = Store.getLocalOrders();

      const totalRevenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);

      const currentSupabaseUrl = localStorage.getItem("lotal_supabase_url") || window.LOTAL_CONFIG?.SUPABASE_URL || "";
      const currentSupabaseKey = localStorage.getItem("lotal_supabase_key") || window.LOTAL_CONFIG?.SUPABASE_ANON_KEY || "";
      const currentPaystackKey = localStorage.getItem("lotal_paystack_key") || window.LOTAL_CONFIG?.PAYSTACK_PUBLIC_KEY || "";
      const isSupabaseLive = currentSupabaseUrl && !currentSupabaseUrl.includes("your-project-ref") && currentSupabaseKey.length > 20;

      app.innerHTML = `
        <div style="max-width: 1400px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 16px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div>
              <p class="micro micro-gold">Operations Console / LOTAL GHANA</p>
              <h1 class="display" style="color: white; font-size: 2rem; margin-top: 4px;">Staff Management Desk</h1>
            </div>
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
              <a href="schema.sql" target="_blank" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.72rem; border-color: var(--color-gold); color: var(--color-gold);">📥 Download Supabase SQL</a>
              <span class="micro" style="color: var(--color-blue-light);">admin@lotalghana.com</span>
              <button onclick="sessionStorage.removeItem('${ADMIN_SESSION_KEY}'); renderAdmin();" class="btn btn-ghost" style="padding: 6px 12px;">Sign Out</button>
            </div>
          </div>

          <!-- Stats -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px;">
            <div class="plate" style="padding: 20px;">
              <span class="micro">Total Orders</span>
              <p class="tabular" style="font-size: 1.8rem; color: white; margin-top: 6px;">${orders.length}</p>
            </div>
            <div class="plate" style="padding: 20px;">
              <span class="micro">Total Revenue</span>
              <p class="tabular" style="font-size: 1.8rem; color: var(--color-gold); margin-top: 6px;">${formatGHS(totalRevenue)}</p>
            </div>
            <div class="plate" style="padding: 20px;">
              <span class="micro">Stock Units</span>
              <p class="tabular" style="font-size: 1.8rem; color: white; margin-top: 6px;">${products.length}</p>
            </div>
            <div class="plate" style="padding: 20px;">
              <span class="micro">Supabase Status</span>
              <p class="micro" style="font-size: 0.85rem; margin-top: 8px; color: ${isSupabaseLive ? 'var(--color-blue-light)' : 'var(--color-gold)'}; font-weight: 600;">
                ${isSupabaseLive ? '● CONNECTED' : '○ LOCAL / SEED'}
              </p>
            </div>
          </div>

          <!-- Supabase & Paystack Live Configuration Panel -->
          <div class="plate-flat" style="padding: 24px; margin-bottom: 30px; border-left: 3px solid var(--color-blue);">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <div>
                <p class="micro micro-gold">Database & Gateway Integration</p>
                <h3 style="color: white; font-size: 1.25rem; margin-top: 4px;">Supabase & Paystack API Keys</h3>
              </div>
              <span class="micro" style="color: var(--color-steel);">Runs 100% in pure HTML/JS</span>
            </div>
            <p style="font-size: 0.88rem; color: var(--color-steel); margin-top: 8px; line-height: 1.5;">
              Enter your live Supabase credentials and Paystack Public Key below. They are saved in your browser and used immediately across the entire HTML store for queries, orders, and checkouts.
            </p>

            <form id="dbConfigForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 18px;">
              <div>
                <label class="micro">Supabase Project URL</label>
                <input type="text" id="supabaseUrlInput" value="${currentSupabaseUrl}" placeholder="https://your-ref.supabase.co" class="field" style="margin-top: 6px;">
              </div>
              <div>
                <label class="micro">Supabase Anon Key</label>
                <input type="text" id="supabaseKeyInput" value="${currentSupabaseKey}" placeholder="eyJhbGciOi..." class="field" style="margin-top: 6px;">
              </div>
              <div>
                <label class="micro">Paystack Public Key</label>
                <input type="text" id="paystackKeyInput" value="${currentPaystackKey}" placeholder="pk_live_... or pk_test_..." class="field" style="margin-top: 6px;">
              </div>
              <div style="display: flex; align-items: flex-end; gap: 8px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save & Connect →</button>
              </div>
            </form>
            <div id="saveMsg" style="display: none; margin-top: 12px; font-size: 0.85rem; color: var(--color-blue-light);"></div>
          </div>

          <!-- Orders Table -->
          <div class="plate" style="padding: 24px; margin-bottom: 30px;">
            <h2 class="display" style="color: white; font-size: 1.4rem; margin-bottom: 16px;">Orders & Live Tracking Updates</h2>
            <div style="overflow-x: auto;">
              <table style="width: 100%; border-collapse: collapse; font-size: 0.88rem;">
                <thead>
                  <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;">
                    <th class="micro" style="padding: 10px;">Tracking Code</th>
                    <th class="micro" style="padding: 10px;">Customer</th>
                    <th class="micro" style="padding: 10px;">Total</th>
                    <th class="micro" style="padding: 10px;">Current Status</th>
                    <th class="micro" style="padding: 10px;">Update Tracking Rail</th>
                  </tr>
                </thead>
                <tbody>
                  ${orders.length === 0 ? `
                    <tr><td colspan="5" style="text-align: center; padding: 30px; color: var(--color-steel);">No customer orders placed yet.</td></tr>
                  ` : orders.map(ord => `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);">
                      <td class="tabular" style="padding: 12px 10px; color: white; font-weight: 600;">${ord.code}</td>
                      <td style="padding: 12px 10px;">
                        <strong style="color: white;">${ord.full_name || ord.fullName}</strong><br>
                        <span class="micro">${ord.city} · ${ord.phone}</span>
                      </td>
                      <td class="tabular" style="padding: 12px 10px; color: var(--color-gold);">${formatGHS(ord.total)}</td>
                      <td style="padding: 12px 10px;">
                        <span class="micro" style="color: var(--color-blue-light); border: 1px solid rgba(27,107,255,0.4); padding: 4px 8px; border-radius: 3px;">
                          ${(ord.status || 'placed').toUpperCase()}
                        </span>
                      </td>
                      <td style="padding: 12px 10px;">
                        <select onchange="updateStatus('${ord.code}', this.value)" class="field" style="font-size: 0.75rem; padding: 6px; width: auto;">
                          <option value="placed" ${ord.status === 'placed' ? 'selected' : ''}>Placed</option>
                          <option value="paid" ${ord.status === 'paid' ? 'selected' : ''}>Paid</option>
                          <option value="packing" ${ord.status === 'packing' ? 'selected' : ''}>Diagnostics & Packing</option>
                          <option value="dispatched" ${ord.status === 'dispatched' ? 'selected' : ''}>Dispatched from Osu</option>
                          <option value="out_for_delivery" ${ord.status === 'out_for_delivery' ? 'selected' : ''}>Out for Delivery</option>
                          <option value="delivered" ${ord.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                        </select>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Inventory List -->
          <div class="plate" style="padding: 24px;">
            <h2 class="display" style="color: white; font-size: 1.4rem; margin-bottom: 16px;">Catalogue Stock & Prices</h2>
            <div style="overflow-x: auto;">
              <table style="width: 100%; border-collapse: collapse; font-size: 0.88rem;">
                <thead>
                  <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;">
                    <th class="micro" style="padding: 10px;">Model</th>
                    <th class="micro" style="padding: 10px;">Grade</th>
                    <th class="micro" style="padding: 10px;">Battery</th>
                    <th class="micro" style="padding: 10px;">Price</th>
                    <th class="micro" style="padding: 10px;">Stock</th>
                  </tr>
                </thead>
                <tbody>
                  ${products.map(p => `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);">
                      <td style="padding: 10px; color: white;"><strong>${p.brand}</strong> ${p.name}</td>
                      <td class="micro micro-gold" style="padding: 10px;">Grade ${p.grade}</td>
                      <td class="tabular" style="padding: 10px; color: var(--color-blue-light);">${p.batteryHealth || p.battery_health}%</td>
                      <td class="tabular" style="padding: 10px; color: var(--color-gold); font-weight: 600;">${formatGHS(p.price)}</td>
                      <td class="tabular" style="padding: 10px; color: white;">${p.stock} units</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById("dbConfigForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const url = document.getElementById("supabaseUrlInput").value.trim();
        const key = document.getElementById("supabaseKeyInput").value.trim();
        const payKey = document.getElementById("paystackKeyInput").value.trim();

        if (url) localStorage.setItem("lotal_supabase_url", url);
        if (key) localStorage.setItem("lotal_supabase_key", key);
        if (payKey) localStorage.setItem("lotal_paystack_key", payKey);

        const msg = document.getElementById("saveMsg");
        msg.textContent = "✓ Configuration saved! Testing Supabase connection & reloading...";
        msg.style.display = "block";

        setTimeout(() => {
          window.location.reload();
        }, 1200);
      });
    }

    window.updateStatus = function(code, newStatus) {
      Store.updateLocalOrderStatus(code, newStatus, `Status updated to ${newStatus.toUpperCase()} by staff desk.`);
      renderDashboard();
    };

    document.addEventListener("DOMContentLoaded", renderAdmin);
  </script>
</body>
</html>
