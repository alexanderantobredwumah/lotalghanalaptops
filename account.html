<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
        <a href="/index.html#contact" class="nav-link">Contact</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 12px;">
        <button onclick="Auth.logout();" class="btn btn-ghost" style="padding: 8px 14px;">Sign Out</button>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px; position: relative;">
          Cart <span class="cart-count-badge tabular" style="display: none; background: var(--color-gold); color: #000; font-size: 0.65rem; border-radius: 50%; width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: 6px; font-weight: 700;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding: 50px 0;">
    <div class="container" id="accountView">
      <!-- Loaded by JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--color-steel);">
      <p>© 2026 LOTAL GHANA LTD · 14-DAY WARRANTY ON EVERY UNIT</p>
      <p><a href="/track.html" style="color: var(--color-blue-light);">TRACK AN ORDER</a></p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = Auth.getUser();
      const container = document.getElementById("accountView");

      if (!user) {
        window.location.href = "/login.html?next=/account.html";
        return;
      }

      const orders = Store.getLocalOrders();

      container.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px;">
          <div>
            <p class="micro micro-gold">Customer Portal / ${user.email}</p>
            <h1 class="display" style="font-size: 2.5rem; color: white; margin-top: 6px;">
              Hello, ${user.fullName.split(" ")[0]}
            </h1>
          </div>
          <div>
            <a href="/shop.html" class="btn btn-primary">Browse Stock →</a>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 30px;">
          <div class="plate-flat" style="padding: 24px;">
            <p class="micro micro-gold">Customer Profile</p>
            <p style="margin-top: 10px; color: white; font-size: 1.1rem; font-weight: 600;">${user.fullName}</p>
            <p class="micro" style="margin-top: 4px;">${user.email}</p>
            <p class="micro" style="margin-top: 4px;">${user.phone || 'Phone not set'} · ${user.city || 'Accra'}</p>
            <p style="margin-top: 14px; font-size: 0.82rem; color: var(--color-gold);">Active buyer account · 14-Day Warranty enabled</p>
          </div>

          <div class="plate-flat" style="padding: 24px;">
            <p class="micro micro-gold">14-Day Warranty Policy</p>
            <p style="font-size: 0.88rem; color: var(--color-steel); margin-top: 8px; line-height: 1.6;">
              Every laptop you purchase through LOTAL GHANA is covered by a 14-day warranty on parts and labour, plus a 7-day money-back guarantee from the moment of delivery.
            </p>
          </div>
        </div>

        <div class="plate" style="padding: 28px; margin-top: 30px;">
          <p class="micro micro-gold">Your Order History (${orders.length})</p>
          ${orders.length === 0 ? `
            <p style="margin-top: 16px; color: var(--color-steel); font-size: 0.95rem;">You have not placed any orders yet.</p>
            <a href="/shop.html" class="btn btn-primary" style="margin-top: 16px;">Browse Available Laptops →</a>
          ` : `
            <table style="width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.9rem;">
              <thead>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;">
                  <th class="micro" style="padding: 10px 0;">Tracking Code</th>
                  <th class="micro" style="padding: 10px 0;">Status</th>
                  <th class="micro" style="padding: 10px 0; text-align: right;">Total</th>
                  <th class="micro" style="padding: 10px 0; text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${orders.map(o => `
                  <tr style="border-bottom: 1px solid rgba(255,255,255,0.06);">
                    <td class="tabular" style="padding: 12px 0; color: white; font-weight: 600;">${o.code}</td>
                    <td style="padding: 12px 0; color: var(--color-blue-light); text-transform: uppercase;">${o.status || 'placed'}</td>
                    <td class="tabular" style="padding: 12px 0; text-align: right; color: var(--color-gold);">${formatGHS(o.total)}</td>
                    <td style="padding: 12px 0; text-align: right;">
                      <a href="/track.html?code=${encodeURIComponent(o.code)}" class="btn btn-ghost" style="padding: 4px 10px; font-size: 0.68rem;">Track</a>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `}
        </div>
      `;
    });
  </script>
</body>
</html>
