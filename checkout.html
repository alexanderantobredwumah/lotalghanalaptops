<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
        <a href="/index.html#contact" class="nav-link">Contact</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="auth-user-slot"></div>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px; position: relative;">
          Cart <span class="cart-count-badge tabular" style="display: none; background: var(--color-gold); color: #000; font-size: 0.65rem; border-radius: 50%; width: 18px; height: 18px; align-items: center; justify-content: center; margin-left: 6px; font-weight: 700;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding: 40px 0;">
    <div class="container" id="checkoutContainer">
      <!-- Checked & populated by JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--color-steel);">
      <p>© 2026 LOTAL GHANA LTD · 14-DAY WARRANTY ON EVERY UNIT</p>
      <p><a href="/track.html" style="color: var(--color-blue-light);">TRACK AN ORDER</a></p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = Auth.getUser();
      const container = document.getElementById("checkoutContainer");
      const cart = Cart.get();

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="plate-flat" style="padding: 60px 20px; text-align: center; max-width: 500px; margin: 40px auto;">
            <p style="font-size: 1.3rem; color: white;">Your cart is empty.</p>
            <p style="font-size: 0.9rem; color: var(--color-steel); margin-top: 8px;">Please select a laptop before proceeding to checkout.</p>
            <a href="/shop.html" class="btn btn-primary" style="margin-top: 20px;">Browse Inventory →</a>
          </div>
        `;
        return;
      }

      // Check registration requirement
      if (!user) {
        container.innerHTML = `
          <div class="glass" style="padding: 40px; border-radius: 8px; max-width: 520px; margin: 40px auto; text-align: center;">
            <p class="micro micro-gold">Account Required</p>
            <h2 class="display" style="font-size: 1.8rem; color: white; margin-top: 8px;">Please Sign In to Checkout</h2>
            <p style="font-size: 0.95rem; color: var(--color-steel); margin-top: 10px; line-height: 1.5;">
              As a policy at LOTAL GHANA, all buyers must register an account with us to attach the <strong>14-day warranty</strong> and receive real-time order tracking updates.
            </p>
            <div style="display: flex; gap: 12px; margin-top: 24px; justify-content: center;">
              <a href="/login.html?next=/checkout.html" class="btn btn-primary">Sign In to Continue →</a>
              <a href="/register.html?next=/checkout.html" class="btn btn-ghost">Create New Account</a>
            </div>
          </div>
        `;
        return;
      }

      const subtotal = Cart.subtotal();
      let selectedCity = user.city || "Accra";
      let deliveryFee = window.LOTAL_CONFIG.DELIVERY_FEES[selectedCity] || 4500;
      let total = subtotal + deliveryFee;

      container.innerHTML = `
        <p class="micro micro-gold">Checkout / Secure Order</p>
        <h1 class="display" style="font-size: 2.4rem; color: white; margin-top: 8px;">Order Details & Gateway</h1>

        <form id="checkoutForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; margin-top: 30px;">
          <div>
            <div class="plate-flat" style="padding: 24px;">
              <p class="micro micro-gold">01 / Delivery Destination</p>
              <div style="margin-top: 16px;">
                <label class="micro">Full Name</label>
                <input type="text" id="custName" required value="${user.fullName}" class="field" style="margin-top: 6px;">
              </div>
              <div style="margin-top: 16px;">
                <label class="micro">Phone (MoMo Enabled)</label>
                <input type="text" id="custPhone" required value="${user.phone || ''}" class="field" style="margin-top: 6px;" placeholder="+233 55 190 4477">
              </div>
              <div style="margin-top: 16px;">
                <label class="micro">Email</label>
                <input type="email" id="custEmail" required value="${user.email}" class="field" style="margin-top: 6px;">
              </div>
              <div style="margin-top: 16px;">
                <label class="micro">City / Region</label>
                <select id="custCity" class="field" style="margin-top: 6px;">
                  ${Object.keys(window.LOTAL_CONFIG.DELIVERY_FEES).map(c => `
                    <option value="${c}" ${c === selectedCity ? 'selected' : ''}>${c} (${formatGHS(window.LOTAL_CONFIG.DELIVERY_FEES[c])})</option>
                  `).join("")}
                </select>
              </div>
              <div style="margin-top: 16px;">
                <label class="micro">Delivery Address & Landmark</label>
                <textarea id="custAddress" required rows="3" placeholder="House number, street name, area, and prominent landmark..." class="field" style="margin-top: 6px;"></textarea>
              </div>
            </div>

            <div class="plate-flat" style="padding: 24px; margin-top: 24px;">
              <p class="micro micro-gold">02 / Payment Method</p>
              <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                <label style="display: flex; gap: 12px; align-items: flex-start; cursor: pointer; border: 1px solid var(--color-blue); padding: 16px; border-radius: 4px; background: rgba(27,107,255,0.08);">
                  <input type="radio" name="paymentMethod" value="paystack" checked style="margin-top: 4px;">
                  <div>
                    <strong style="color: white; font-size: 1rem;">Paystack Ghana (MoMo & Card)</strong>
                    <p style="font-size: 0.82rem; color: var(--color-steel); margin-top: 4px;">
                      MTN Mobile Money, Telecel Cash, AT Money, Visa, Mastercard. Live API keys supported.
                    </p>
                  </div>
                </label>
                <label style="display: flex; gap: 12px; align-items: flex-start; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 4px;">
                  <input type="radio" name="paymentMethod" value="delivery" style="margin-top: 4px;">
                  <div>
                    <strong style="color: white; font-size: 1rem;">Pay on Delivery</strong>
                    <p style="font-size: 0.82rem; color: var(--color-steel); margin-top: 4px;">
                      Available in Accra & Tema. Inspect your laptop before paying the delivery rider.
                    </p>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div>
            <div class="plate" style="padding: 24px;">
              <p class="micro micro-gold">Order Summary</p>
              <ul style="list-style: none; margin-top: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 16px;">
                ${cart.map(i => `
                  <li style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px;">
                    <span style="color: var(--color-fog);">${i.brand} ${i.name} × ${i.qty}</span>
                    <span class="tabular" style="color: var(--color-gold);">${formatGHS(i.price * i.qty)}</span>
                  </li>
                `).join("")}
              </ul>
              <div style="margin-top: 16px; display: flex; justify-content: space-between; font-size: 0.9rem;">
                <span style="color: var(--color-steel);">Subtotal</span>
                <span class="tabular" style="color: white;">${formatGHS(subtotal)}</span>
              </div>
              <div style="margin-top: 8px; display: flex; justify-content: space-between; font-size: 0.9rem;">
                <span style="color: var(--color-steel);">Delivery (<span id="cityLabel">${selectedCity}</span>)</span>
                <span class="tabular" id="deliveryLabel" style="color: white;">${formatGHS(deliveryFee)}</span>
              </div>
              <div style="margin-top: 8px; display: flex; justify-content: space-between; font-size: 0.9rem;">
                <span style="color: var(--color-steel);">14-Day Warranty</span>
                <span style="color: var(--color-gold);">Included</span>
              </div>
              <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: baseline;">
                <span class="micro" style="color: white;">Total</span>
                <span class="tabular" id="totalLabel" style="font-size: 1.5rem; color: var(--color-gold); font-weight: 700;">${formatGHS(total)}</span>
              </div>
              <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Confirm & Pay →</button>
              <p class="micro" style="margin-top: 14px; text-align: center; color: var(--color-steel);">Generates unique tracking code immediately</p>
            </div>
          </div>
        </form>
      `;

      // Update fees on city change
      document.getElementById("custCity").addEventListener("change", (e) => {
        selectedCity = e.target.value;
        deliveryFee = window.LOTAL_CONFIG.DELIVERY_FEES[selectedCity] || 4500;
        total = subtotal + deliveryFee;
        document.getElementById("cityLabel").textContent = selectedCity;
        document.getElementById("deliveryLabel").textContent = formatGHS(deliveryFee);
        document.getElementById("totalLabel").textContent = formatGHS(total);
      });

      // Handle checkout submit
      document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "Processing order...";

        const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
        const fullName = document.getElementById("custName").value.trim();
        const phone = document.getElementById("custPhone").value.trim();
        const email = document.getElementById("custEmail").value.trim();
        const city = document.getElementById("custCity").value;
        const address = document.getElementById("custAddress").value.trim();

        // 1. Create Order
        const order = await Store.createOrder({
          fullName,
          phone,
          email,
          city,
          address,
          paymentMethod,
          subtotal,
          delivery: deliveryFee,
          total,
          items: cart,
        });

        Cart.clear();

        // 2. Paystack Gateway flow
        if (paymentMethod === "paystack") {
          payWithPaystack({
            email: email,
            amountInPesewas: total,
            reference: order.code,
            onSuccess: (response) => {
              Store.updateLocalOrderStatus(order.code, "paid", `Payment confirmed via Paystack (${response.reference}). 14-day warranty active.`);
              window.location.href = `/order.html?code=${order.code}&paid=1`;
            },
            onClose: () => {
              window.location.href = `/order.html?code=${order.code}&paid=0`;
            },
          });
        } else {
          // Pay on delivery
          window.location.href = `/order.html?code=${order.code}`;
        }
      });
    });
  </script>
</body>
</html>
