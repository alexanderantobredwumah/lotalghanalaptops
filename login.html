<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — LOTAL GHANA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="./app.js"></script>
  <script src="/app.js"></script>
</head>
<body style="background: radial-gradient(circle at 50% 30%, rgba(27,107,255,0.12), var(--color-void) 70%);">

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" style="display: flex; align-items: center; gap: 10px;">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="color: var(--color-blue-light)">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7 3h25.2L45 15.8V41a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm7.4 12.2a1 1 0 0 0-1 1v19.6a1 1 0 0 0 1 1h19.4a1 1 0 0 0 1-1v-6.1a1 1 0 0 0-1-1H17.4V16.2a1 1 0 0 0-1-1Z" fill="currentColor"/>
          <path d="M33.4 4.1 35 6.2l2.5.3-1.9 1.7.5 2.5-2.2-1.3-2.2 1.3.5-2.5-1.9-1.7 2.5-.3 1.6-2.1Z" fill="#F5B21E"/>
        </svg>
        <span style="font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: white;">LOTAL <span class="micro micro-gold" style="font-size: 0.62rem;">GHANA</span></span>
      </a>

      <nav class="nav-links">
        <a href="/shop.html" class="nav-link">Inventory</a>
        <a href="/track.html" class="nav-link">Track Order</a>
        <a href="/index.html#warranty" class="nav-link">14-Day Warranty</a>
      </nav>

      <div>
        <a href="/cart.html" class="btn btn-ghost" style="padding: 8px 14px;">Cart</a>
      </div>
    </div>
  </header>

  <main style="display: flex; align-items: center; justify-content: center; padding: 60px 20px;">
    <div class="glass" style="max-width: 440px; width: 100%; padding: 36px; border-radius: 8px;">
      <p class="micro micro-gold">Account / Access</p>
      <h1 class="display" style="font-size: 2rem; color: white; margin-top: 8px;">Customer Sign In</h1>
      <p style="font-size: 0.88rem; color: var(--color-steel); margin-top: 6px;">
        Sign in to buy laptops, manage tracking codes and verify your <strong>14-day warranty</strong>.
      </p>

      <div id="errorBox" style="display: none; background: rgba(255,80,80,0.15); color: #ff9999; padding: 12px; border-radius: 4px; margin-top: 16px; font-size: 0.88rem;"></div>

      <form id="loginForm" style="margin-top: 24px;">
        <div>
          <label class="micro">Email Address</label>
          <input type="email" id="loginEmail" required class="field" style="margin-top: 6px;" placeholder="you@example.com">
        </div>
        <div style="margin-top: 16px;">
          <div style="display: flex; justify-content: space-between;">
            <label class="micro">Password</label>
            <a href="/forgot-password.html" class="micro" style="color: var(--color-blue-light);">Forgot?</a>
          </div>
          <input type="password" id="loginPass" required class="field" style="margin-top: 6px;" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Sign In →</button>
      </form>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); text-align: center; font-size: 0.88rem; color: var(--color-steel);">
        Don't have an account yet? <a href="/register.html" style="color: var(--color-blue-light); text-decoration: underline;">Create account</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type='submit']");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Signing in...";
      }

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value;
      const errBox = document.getElementById("errorBox");
      errBox.style.display = "none";

      const res = await Store.loginCustomer(email, pass);
      if (res.ok) {
        const urlParams = new URLSearchParams(window.location.search);
        window.location.href = urlParams.get("next") || "account.html";
      } else {
        errBox.textContent = res.error || "Invalid email or password.";
        errBox.style.display = "block";
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Sign In →";
        }
      }
    });
  </script>
</body>
</html>
